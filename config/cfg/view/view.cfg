[License] < "idol.common.cfg" [License]

[Service]
ServicePort=9082
Access-Control-Allow-Origin=*
XSLTemplates=FALSE

[Server]
Port=9080

Threads=4
MaxInputString=64000
XSLTemplates=FALSE
LogRequestTiming=TRUE

//--------------------------- Authorization Roles ----------------------------//
[AuthorizationRoles]
0=AdminRole
1=QueryRole

[AdminRole] < "idol.common.cfg" [AdminRole]

[QueryRole] < "idol.common.cfg" [QueryRole]
//----------------------------------------------------------------------------//

[Paths]
ViewingFiltersPath=./filters
LanguageDirectory=./langfiles
ViewingTemplatesPath=./filters/templates

[Viewing]
DefaultLanguageType=englishUTF8
DefaultHtmlEncoding=utf8
AutomateHiFiPDF=true

// Expire cached jobs older than this
CacheExpirySeconds=86400
DefaultStartTag=<font style="background-color:#87bf5e">
DefaultEndTag=</font>

// By default the View server does not support access to special Windows shares
// containing dollar symbols. With this option you can specify a
// comma-separated list of any such shares that you require access to.
//ViewAllowedSpecialUNCPathsCSVs=\\myserver\testshare$

// By default, the viewing service supports only HTTP and Windows UNC paths
// For files on local disk - Viewserver will not display files outside these dirs:
ViewLocalDirectoriesCSVs=E:\ViewCache

// set to True to make hyperlinks point to internet. false means hyperlinks are actions
OriginalBaseUrl=false

// don''t remove javascript
StripScript=false

// A Content engine or IDOL Proxy to highlight results
IDOLHost=localhost
IDOLPort=9100

CacheExpirySeconds=432000
HighlightChunkSize=-1
DocumentChunkSize=10000000
DefaultDownloadURLTimeout=1200
MaxFileSizeBytes=-1
MaxInputString=-1
MaxFileUploadSize=-1

DistributedConnectorHost=localhost
DistributedConnectorPort=10000
// For viewing references over HTTPS 
//OutgoingSSLConfig=SSLSection

[SSLSection]
SSLMethod=SSLV23

//---------------------------Logging-------------------------------//
[Logging] < "idol.common.cfg" [Logging]

// Log streams
0=ApplicationLogStream
1=QueryLogStream

[ApplicationLogStream] < "idol.common.cfg" [ApplicationLogStream]

[QueryLogStream] < "idol.common.cfg" [QueryLogStream]

//--------------------------- Custom Viewing Errors ---------------------------------//
[CustomViewingErrors]
HTMLDirectory=./custom_viewing_errors
AuthorizationRequired=authorizationrequired.html
BadOutputType=badoutputtype.html
DCError=dcerror.html
DecryptionFailed=decryptionfailed.html
Disabled=disabled.html
ErrorWritingToOutputFile=errorwritingtooutputfile.html
FileTooBig=filetoobig.html
NoReader=noreader.html
UnsupportedFormat=unsupportedformat.html


[UniversalViewing]
Enabled=True
DocumentStoreHost=localhost
DocumentStorePort=9100
DistributedConnectorReferenceField=AUTN_IDENTIFIER
WebURLField=Weburl
FileSystemReferenceField=AUTN_IDENTIFIER
ConnectorGroupField=Connector_Group
DocumentStoreReferenceField=DREREFERENCE
