[License] < "idol.common.cfg" [License]

[Service]
ServicePort=9052
Access-Control-Allow-Origin=*
XSLTemplates=TRUE

[Server]
Port=9050
IndexPort=9051

Threads=4
MaxInputString=250000
XSLTemplates=TRUE
LogRequestTiming=TRUE

AdvancedSearch=TRUE
AdvancedCaseSearch=FALSE
AdvancedPlus=FALSE

MaxResults=10000000
MaxQueryTerms=4096
//QueryTimeoutInMilliseconds=30000

// De-duplicate documents by the following fields e.g. */DREREFERENCE
KillDuplicates=*/DREREFERENCE

// CSV of tags that define the start / end of an XML document
DocumentDelimiterCSVs=*/DOCUMENT

DateFormatCSVs=SHORTMONTH#SD+#SYYYY,DD/MM/YYYY,YYYY/MM/DD,YYYY-MM-DD,AUTNDATE

SplitNumbers=FALSE
AgentBooleanCacheField=*/BOOLEANRESTRICTION
FieldTextCacheField=*/FIELDTEXTRESTRICTION

DelayedSync=FALSE

//--------------------------- Authorization Roles ----------------------------//
[AuthorizationRoles]
0=AdminRole
1=QueryRole
2=IndexRole

[AdminRole] < "idol.common.cfg" [AdminRole]

[QueryRole] < "idol.common.cfg" [QueryRole]

[IndexRole] < "idol.common.cfg" [IndexRole]

//--------------------------- Cache Settings ---------------------------------//
[IndexCache]
IndexCacheMaxSize=51200

//--------------------------- Paths -------------------------------------------//
// This allows the database to be split across multiple partitions
[Paths]
// Set ArchivePath to archive all incoming index commands/data
//ArchivePath=./index/archive
DyntermPath=./index/dynterm
NodetablePath=./index/nodetable
RefIndexPath=./index/refindex
MainPath=./index/main
StatusPath=./index/status
TagPath=./index/tagindex
NumericPath=./index/numeric
SortfieldPath=./index/sortfield
StatePath=./index/storedstate
IndexQueuePath=./index/indexqueue
BitFieldPath=./index/bitfield
SecindexPath=./index/secindex
GeospatialPath=./index/geoindex
IndexTempPath=./index/indextmp
VectorPath=./index/vector

TemplateDirectory=./templates

[FieldProcessing]
0=SetIndexFields
1=SetIndexWeightFields
2=SetSectionBreakFields
3=SetDateFields
4=SetDatabaseFields
5=SetReferenceFields
6=SetTitleFields
7=SetHighlightFields
8=SetSourceFields
9=SetTextParseIndexFields
10=SetSectionBreakFields
11=SetAlwaysMatchFields

[SetIndexFields]
Property=IndexFields
PropertyFieldCSVs=*/DRECONTENT,*/TRAINING

[SetIndexWeightFields]
Property=IndexWeightFields
PropertyFieldCSVs=*/SUMMARIES

[SetSectionBreakFields]
// Field containing document section number
Property=SectionFields
PropertyFieldCSVs=*/DRESECTION

[SetDateFields]
Property=DateFields
PropertyFieldCSVs=*/DREDATE

[SetDatabaseFields]
Property=DatabaseFields
PropertyFieldCSVs=*/DREDBNAME

[SetReferenceFields]
Property=ReferenceFields
PropertyFieldCSVs=*/DREREFERENCE

[SetTitleFields]
Property=TitleFields
PropertyFieldCSVs=*/DRETITLE

[SetHighlightFields]
Property=HighlightFields
PropertyFieldCSVs=*/DRETITLE,*/DRECONTENT

[SetSourceFields]
Property=SourceFields
PropertyFieldCSVs=*/DRETITLE,*/DRECONTENT,*/TRAINING

[SetTextParseIndexFields]
property=TextParseIndexFields
propertyfieldcsvs=*/DRETITLE,*/DRECONTENT,*/TRAINING

[SetAlwaysMatchFields]
Property=AlwaysMatchFields
PropertyFieldCSVs=*/ALWAYSMATCH

//---------------------------Properties-------------------------------//
[IndexFields]
Index=TRUE

[IndexWeightFields]
Index=TRUE
Weight=2

[SectionFields]
SectionBreakType=TRUE

[DateFields]
DateType=TRUE

[DatabaseFields]
DatabaseType=TRUE

[ReferenceFields]
ReferenceType=TRUE
TrimSpaces=TRUE

[TitleFields]
TitleType=TRUE

[HighlightFields]
HighlightType=TRUE

[SourceFields]
SourceType=TRUE

[TextParseIndexFields]
TextParseIndexType=TRUE

[AlwaysMatchFields]
AlwaysMatchType=TRUE

//--------------------------- Logging ----------------------------------------//
[Logging] < "idol.common.cfg" [Logging]

// Log streams
0=ApplicationLogStream
1=QueryLogStream
2=IndexLogStream

[ApplicationLogStream] < "idol.common.cfg" [ApplicationLogStream]

[QueryLogStream] < "idol.common.cfg" [QueryLogStream]

[IndexLogStream] < "idol.common.cfg" [IndexLogStream]

