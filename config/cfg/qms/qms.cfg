[License] < "idol.common.cfg" [License]

[Service]
ServicePort=16002
Access-Control-Allow-Origin=*
XSLTemplates=TRUE

[Server]
Port=16000

Threads=4
MaxInputString=64000
XSLTemplates=TRUE
LogRequestTiming=TRUE

DefaultLanguageType=EnglishUTF8

// This is needed to enable Boost rules (FieldText expansions)
ExpandFieldText=TRUE

// Required to work with ABC!
UseAutnMatchCat=TRUE

//--------------------------- Authorization Roles ----------------------------//
[AuthorizationRoles]
0=AdminRole
1=QueryRole

[AdminRole] < "idol.common.cfg" [AdminRole]

[QueryRole] < "idol.common.cfg" [QueryRole]

//--------------------------- IDOL -------------------------------------------//
// Configure the [IDOL] section with details of the IDOLServer, 
// DAH engine or Content engine that holds data
[IDOL]
Host=localhost
Port=9060

//--------------------------- Community --------------------------------------//
// If Intent-Based-Ranking is activated, and the [IDOL] section does not point
// to an IDOLServer that communicates with a Community component, then
// configure the details of the Community component here
[Community]
Host=localhost
Port=9030

//--------------------------- Promotion Agentstore ---------------------------//
// Configure the [PromotionAgentStore] section with details of the
// agentstore component that holds the QMS rules
[PromotionAgentStore]
Host=localhost
Port=9150

[Paths]
TemplateDirectory=./templates

//---------------------------Logging-------------------------------//
[Logging] < "idol.common.cfg" [Logging]

// Log streams
0=ApplicationLogStream
1=QueryLogStream

[ApplicationLogStream] < "idol.common.cfg" [ApplicationLogStream]

[QueryLogStream] < "idol.common.cfg" [QueryLogStream]

//--------------------------- Language Types ---------------------------------//
[LanguageTypes]
LanguageDirectory=./langfiles
