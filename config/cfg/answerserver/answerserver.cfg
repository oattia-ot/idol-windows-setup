[License]
LicenseServerHost=localhost
LicenseServerACIPort=20000
LicenseServerTimeout=60000
LicenseServerRetries=1

[Service]
ServicePort=12002
Access-Control-Allow-Origin=*

[Server]
Port=12000

Threads=4
MaxInputString=64000
LogRequestTiming=TRUE
XSLTemplates=TRUE

[Paths]
TemplateDirectory=./templates

[AuthorizationRoles]
0=AdminRole
1=QueryRole

[AdminRole]
StandardRoles=admin,servicecontrol,query,servicestatus
Clients=localhost
//SSLIdentities=
//GSSPrincipals=

[QueryRole]
StandardRoles=query,servicestatus
Clients=localhost
//SSLIdentities=
//GSSPrincipals=

[Systems]
// Numbered list of config sections configuring an answer system
0=AnswerBank
1=Grok_4


[AnswerBank]
Type=answerbank
IdolHost=localhost
IdolAciPort=9450

[Grok_4]
Type=RAG
IDOLHost=localhost
IDOLACIPort=9100
// Module to use
ModuleID=Grok_4_LLM
//RAG Settings
RetrievalType=conceptual
PromptTemplatePath=./rag/prompt_template.txt
PromptTokenLimit=100000
MaxQuestionSize=70
ACIMaxResults=3
ReferenceField=DREREFERENCE
TopicLandmark=Topics
TopicTemplatePath=./Topics/topictemplate.txt
UserRole=User
AssistantRole=ChatBot
CandidateRetrievalDefaults=CandidateRetrievalParamsDocumentum

[CandidateRetrievalParamsDocumentum]
DatabaseMatch=IL_Railways
ActionID=Pumpkin

[Grok_4_LLM]
Type=GenerativeLua
Script=./rag/grok.lua
