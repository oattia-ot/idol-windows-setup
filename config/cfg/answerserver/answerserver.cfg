[Logging]
LogArchiveDirectory=./logs/archive
LogDirectory=./logs
LogTime=TRUE
LogOutputLogLevel=TRUE
LogLevel=normal
// Log streams
0=ApplicationLogStream
1=ActionLogStream
2=FactBankLogStream
3=AnswerBankLogStream
4=PassageExtractorLogStream
5=ConversationModuleLogStream

[ApplicationLogStream]
LogFile=application.log
LogTypeCSVs=application

[ActionLogStream]
LogFile=action.log
LogTypeCSVs=action

[FactBankLogStream]
LogFile=factbank.log
LogTypeCSVs=factbank

[AnswerBankLogStream]
LogFile=answerbank.log
LogTypeCSVs=answerbank

[PassageExtractorLogStream]
LogFile=passageextractor.log
LogTypeCSVs=passageextractor

[ConversationModuleLogStream]
LogFile=conversation.log
LogTypeCSVs=conversation
